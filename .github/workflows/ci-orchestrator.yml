name: CI Orchestrator

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/labeler.yml'
      - 'project_manifest.json'
      - 'project_connections.json'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/labeler.yml'
      - 'project_manifest.json'
      - 'project_connections.json'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # --- Backend Checks ---
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Deps
        run: |
          pip install poetry
          cd backend && poetry install --no-root -E dev

      - name: Lint Backend
        run: cd backend && poetry run ruff check .

      - name: Test Backend
        run: cd backend && poetry run pytest

      # --- Frontend Checks ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Deps
        run: |
          cd frontend
          npm ci
          npm audit fix --audit-level=high || true

      - name: Lint Frontend
        run: cd frontend && npm run lint

      # --- Docker Build Validation ---
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: test-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate Frontend Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: test-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- Automated Manifest Maintenance ---
      - name: Regenerate Manifest
        run: |
          python3 scripts/generate_manifest.py
          
      - name: Commit and Push Changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add project_manifest.json project_connections.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(docs): regenerate project manifest and connections [skip ci]"
            git push
          else
            echo "No changes in manifest or connections."
          fi

