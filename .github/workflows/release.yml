name: Release Workflow

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'nightly'
        type: choice
        options:
          - nightly
          - stable

permissions:
  contents: write
  packages: write

concurrency:
  group: er-psscripter-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # --- Versioning ---
      - name: Calculate Version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          RUN_ID: ${{ github.run_id }}
        run: |
          VERSION=$(python3 version_manager.py --release-type "$RELEASE_TYPE" --run-id "$RUN_ID")
          echo "Calculated Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Commit & Push Version
        if: inputs.release_type == 'stable'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          printf '%s\n' "$VERSION" > VERSION
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add VERSION
          if ! git diff --cached --quiet; then
            git commit -m "Bump version to $VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # --- Tagging ---
      - name: Create Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "Tag already exists: ${TAG}" >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin "refs/tags/${TAG}"

      # --- Release Notes ---
      - name: Generate Release Notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ inputs.release_type == 'nightly' }}
          make_latest: ${{ inputs.release_type == 'stable' && 'true' || 'false' }}

      - name: Lowercase Repo
        run: echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # --- Docker Build & Push ---
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend
      - name: Build/Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_NAME }}/backend:${{ steps.version.outputs.version }}
            ${{ inputs.release_type == 'stable' && format('ghcr.io/{0}/backend:latest', env.REPO_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend
      - name: Build/Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ env.REPO_NAME }}/frontend:${{ steps.version.outputs.version }}
            ${{ inputs.release_type == 'stable' && format('ghcr.io/{0}/frontend:latest', env.REPO_NAME) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

