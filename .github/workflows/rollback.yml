name: Rollback Stable Alias

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: 'Stable CalVer version to restore as latest (e.g. 2026.11.1)'
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate stable release and images
        env:
          VERSION: ${{ inputs.stable_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$VERSION" =~ ^([0-9]{4})\.([1-9]|1[0-2])\.([1-9][0-9]*)$ ]]; then
            echo "Expected a stable version in YYYY.M.PATCH format." >&2
            exit 1
          fi

          TAG="v${VERSION}"
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null &&
             ! git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null; then
            echo "Stable Git tag does not exist: ${TAG}" >&2
            exit 1
          fi

          REPOSITORY_LOWER=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          for SERVICE in backend frontend; do
            IMAGE="ghcr.io/${REPOSITORY_LOWER}/${SERVICE}:${VERSION}"
            if ! docker buildx imagetools inspect "$IMAGE" >/dev/null; then
              echo "Stable container image does not exist: ${IMAGE}" >&2
              exit 1
            fi
          done

      - name: Restore latest aliases
        env:
          VERSION: ${{ inputs.stable_version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          REPOSITORY_LOWER=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          for SERVICE in backend frontend; do
            IMAGE="ghcr.io/${REPOSITORY_LOWER}/${SERVICE}"
            docker buildx imagetools create \
              --tag "${IMAGE}:latest" \
              "${IMAGE}:${VERSION}"
          done
